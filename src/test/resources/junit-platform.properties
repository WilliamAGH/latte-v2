# JUnit 5 Global Timeout Configuration
# Prevents tests from hanging indefinitely - fails with stack trace on timeout

# Default timeout for all testable methods (tests, lifecycle methods)
junit.jupiter.execution.timeout.default = 30s

# Specific timeout for @Test methods
junit.jupiter.execution.timeout.testable.method.default = 10s

# Timeout for @BeforeAll/@AfterAll methods
junit.jupiter.execution.timeout.lifecycle.method.default = 30s

# Timeout for @TestTemplate methods
junit.jupiter.execution.timeout.testtemplate.method.default = 10s

# Timeout for @BeforeEach methods
junit.jupiter.execution.timeout.beforeeach.method.default = 10s

# Timeout for @AfterEach methods  
junit.jupiter.execution.timeout.aftereach.method.default = 10s

# Thread mode: SEPARATE_THREAD captures actual blocking stack trace on timeout
junit.jupiter.execution.timeout.thread.mode = SEPARATE_THREAD
